source.. = src/,\
           xtend-gen/
output.. = bin/
# refactoring-plugin/ is packaged, unlike tools/: the running plugin passes it
# to the CLI with --plugin-dir, so it has to exist in an installed bundle and
# not only in a checkout.
bin.includes = META-INF/,\
               .,\
               plugin.xml,\
               refactoring-plugin/
